<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201e43">
  <meta name="description" content="Play Doodle Auto, Drive Mad and Side Pocket in the Sully6 browser arcade.">
  <title>Sully6 Arcade</title>
  <link rel="icon" href="/arcade/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/arcade/style.css">
  <script defer src="/arcade/filter.js"></script>
</head>
<body>
  <header>
    <div class="bar">
      <a href="/" class="brand" aria-label="Sully6 Arcade home"><span class="mark" aria-hidden="true">6</span>SULLY<span class="six">6</span></a>
      <label class="search" hidden><span aria-hidden="true"></span><input type="search" id="search" autocomplete="off" placeholder="Find a game" aria-label="Find a game"></label>
    </div>
  </header>
  <main>
    <div class="headline"><div><p class="eyebrow"><i aria-hidden="true"></i> GAME LIBRARY</p><h1>The arcade<span>.</span></h1></div><div class="checker" aria-hidden="true"></div></div>
    <section aria-label="Games">
      <div class="tools"><div class="filters" aria-label="Game categories" role="group" hidden>
        <button type="button" data-filter="all" aria-pressed="true">All games</button><button type="button" data-filter="driving" aria-pressed="false">Driving</button><button type="button" data-filter="sports" aria-pressed="false">Sports</button>
      </div><output aria-live="polite" id="count">3 games</output></div>
      <div class="cards">
        <a class="card auto" data-category="driving" href="https://gta.sully6.com/">
          <div class="art"><img src="/arcade/doodle-auto.jpg" alt="" width="1254" height="627"></div>
          <div class="caption"><div><small>Open-world driving</small><h2>Doodle Auto</h2><p>Hit the streets of Switchback County.</p></div><span class="play" aria-hidden="true"></span></div>
        </a>
        <a class="card ridge" data-category="driving" href="https://drive-mad.sully6.com/">
          <div class="art"><img src="/arcade/drive-mad.jpg" alt="" width="1000" height="500"></div>
          <div class="caption"><div><small>Off-road trials</small><h2>Drive Mad</h2><p>Balance your truck over the ridgeline.</p></div><span class="play" aria-hidden="true"></span></div>
        </a>
        <a class="card pool" data-category="sports" href="https://pool.sully6.com/">
          <div class="art"><img src="/arcade/side-pocket.jpg" alt="" width="1254" height="627"></div>
          <div class="caption"><div><small>Arcade sports</small><h2>Side Pocket</h2><p>Shoot eight-ball solo or with a friend.</p></div><span class="play" aria-hidden="true"></span></div>
        </a>
      </div>
      <div class="empty" hidden><h2>No games found</h2><button type="button" id="clear">Show all games</button></div>
    </section>
  </main>
</body>
</html>
