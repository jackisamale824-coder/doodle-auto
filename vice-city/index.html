<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#201930" />
    <title>Vice Coast</title>
    <link rel="icon" href="/arcade/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="game">
      <canvas id="view" aria-label="Third-person view of Vice Coast"></canvas>
      <section id="menu" aria-labelledby="title">
        <div class="menu-copy">
          <div class="place">OCEAN STRIP &nbsp; / &nbsp; 1986</div>
          <h1 id="title">Vice <em>Coast</em></h1>
          <p id="brief">
            Your coupe is waiting on Ocean Strip. Pick up a late shift and
            follow the lights along the coast.
          </p>
          <button id="start" disabled>Starting engine…</button>
          <p class="keys">
            WASD or arrows to move · F to enter or exit a car · Space to brake
            or punch on foot · Esc to pause
          </p>
        </div>
      </section>
      <section id="hud" hidden aria-label="Game controls and status">
        <div class="job">
          <small id="chapter"></small
          ><strong id="objective" aria-live="polite"></strong
          ><span id="distance"></span>
        </div>
        <div class="status">
          <b id="cash"></b><span id="heat"></span>
          <button id="sound" aria-label="Mute game audio" aria-pressed="true">
            ♫
          </button>
          <button id="pause" aria-label="Pause game">Ⅱ</button>
        </div>
        <output id="notice" aria-live="polite"></output>
        <canvas
          id="radar"
          width="230"
          height="210"
          aria-label="Street map with your position and the next checkpoint"
        ></canvas>
        <div class="dash">
          <strong id="speed"></strong><small id="unit"></small
          ><span id="interaction"></span>
        </div>
        <div class="touch">
          <div>
            <button data-key="ArrowLeft" aria-label="Steer left">◀</button
            ><button data-key="ArrowRight" aria-label="Steer right">▶</button>
          </div>
          <div>
            <button id="punch" hidden>Punch</button>
            <button id="swap">Exit car</button
            ><button data-key="ArrowDown" aria-label="Brake or reverse">
              ▼</button
            ><button data-key="ArrowUp" aria-label="Move forward">▲</button>
          </div>
        </div>
      </section>
      <noscript>This game needs JavaScript and WebGL.</noscript>
    </main>
    <script type="module" src="/src/vice-city/game.ts"></script>
  </body>
</html>
