name: Deploy sully6.com
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sully6-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the production CLOUDFLARE_API_TOKEN in repository Actions secrets, then rerun this workflow."
            exit 1
          fi
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -fsS -H "$auth" "$api/zones?name=sully6.com&status=active" | jq -e '.result | select(length == 1) | .[0]')
          account=$(jq -er '.account.id' <<< "$zone")
          zone_id=$(jq -er '.id' <<< "$zone")
          worker=$(curl -fsS -H "$auth" "$api/accounts/$account/workers/domains?hostname=sully6.com" |
            jq -er --arg zone "$zone_id" '[.result[] | select(.hostname == "sully6.com" and .zone_id == $zone)] | select(length == 1) | .[0].service')
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "GAME_WORKER_NAME=$worker" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:cloudflare
      - run: npx --no-install tsx --test tests/spatial-snapshots.test.ts tests/session-resume.test.ts tests/player-accounts.test.ts
      - run: npm run build:app
      - name: Deploy game container and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install cf deploy --tag "${GITHUB_SHA:0:12}" --message "Deploy $GITHUB_SHA" --containers-rollout gradual
      - name: Verify production client and multiplayer protocol
        run: |
          for attempt in {1..30}; do
            if node scripts/verify-spatial-release.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
