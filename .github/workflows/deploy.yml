name: Deploy sully6.com
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sully6-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      CLOUDFLARE_ACCOUNT_ID: da93074d729554cb8b947e4fca904c8b
      GAME_WORKER_NAME: doodle-auto
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the production CLOUDFLARE_API_TOKEN in repository Actions secrets, then rerun this workflow."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:cloudflare
      - run: npx --no-install tsx --test tests/spatial-snapshots.test.ts tests/session-resume.test.ts tests/player-accounts.test.ts tests/google-login.test.ts
      - run: npx --no-install tsx --test tests/pool.test.ts
      - run: npm run build:app
      - name: Deploy game container and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install cf deploy --tag "${GITHUB_SHA:0:12}" --message "Deploy $GITHUB_SHA" --containers-rollout gradual
      - name: Verify production client and multiplayer protocol
        run: |
          for attempt in {1..30}; do
            if node scripts/verify-spatial-release.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Attach pool hostname to the game Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if curl -fsS --max-time 15 https://pool.sully6.com/ | grep -Fq '<title>Side Pocket'; then exit 0; fi
          curl --fail-with-body --silent --show-error -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"hostname":"pool.sully6.com","service":"doodle-auto","zone_id":"8f226a21ea38287b02ae38fce9c10de2","enabled":true}'
