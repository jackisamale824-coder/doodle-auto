name: Deploy sully6.com
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sully6-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      CLOUDFLARE_ACCOUNT_ID: da93074d729554cb8b947e4fca904c8b
      GAME_WORKER_NAME: doodle-auto
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the production CLOUDFLARE_API_TOKEN in repository Actions secrets, then rerun this workflow."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:cloudflare
      - run: npx --no-install tsx --test tests/spatial-snapshots.test.ts tests/session-resume.test.ts tests/player-accounts.test.ts tests/google-login.test.ts
      - run: npx --no-install tsx --test tests/pool.test.ts tests/release-build.test.ts tests/client-release.test.ts tests/game-backend.test.ts tests/match-checkpoints.test.ts
      - run: npm run build:app
      - run: node scripts/check-match-recovery.mjs
      - name: Deploy game container and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install cf deploy --tag "${GITHUB_SHA:0:12}" --message "Deploy $GITHUB_SHA" --containers-rollout gradual
      - name: Verify production client and multiplayer protocol
        run: |
          for attempt in {1..30}; do
            if node scripts/verify-arcade.mjs && node scripts/verify-spatial-release.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
